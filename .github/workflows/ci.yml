name: CHRONOS Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax checks
        run: npm run lint
      - name: VS Code webview smoke test
        run: node tools/vscode_smoke.cjs
      - name: Root GitHub Pages integrity and asset path checks
        run: node tools/pages_smoke.cjs
      - name: 10-second completion ringtone tests
        run: node tools/ringtone_test.cjs
      - name: Local sync protocol and security tests
        run: node tools/sync_test.cjs
      - name: VS Code to Chrome sync integration test
        run: node tools/vscode_sync_test.cjs
      - name: Extension packaging smoke test
        run: python tools/build_vsix.py
